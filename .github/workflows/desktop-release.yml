# デスクトップアプリの配布物を作り、GitHub Releases に下書きとして添付する。
#  - タグ desktop-v* を push すると、macOS (dmg / zip) と Windows (インストーラ / zip) を作り、そのタグの下書きのリリースを
#    1つだけ作って配布物をまとめて添付する (OS ごとのジョブは配布物を作るだけで、公開はしない。2つのジョブが別々に
#    下書きを作ったり、electron-builder の既定のタグ名 vX.Y.Z (ライブラリのリリースと同じ形) を使ったりしないため)
#  - 自動更新の情報 (latest*.yml) の配布物の名前は、そのリリースのダウンロード用の絶対 URL に書き換えておく。
#    下書きを公開すると、desktop-update-feed.yml が自動更新の参照先 (プレリリース desktop-latest) にこれを置く
#  - 手動実行 (workflow_dispatch) では公開せず、配布物を Actions の成果物として残す
# 署名・公証は Secrets があるときだけ行う (無ければ署名なし)。必要な Secrets は desktop/DISTRIBUTION.md を参照。
name: Desktop release

on:
  push:
    tags: ["desktop-v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json
      - run: npm ci
      - run: npm ci
        working-directory: desktop
      - name: Check that the tag matches desktop/package.json
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        shell: bash
        working-directory: desktop
        run: |
          v=$(node -p "require('./package.json').version")
          test "desktop-v$v" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != desktop-v$v"; exit 1; }
      - run: npm run build
        working-directory: desktop
      - name: Write the App Store Connect API key
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          [ -n "$APPLE_API_KEY_P8" ] || { echo "no API key: the app will not be notarized"; exit 0; }
          echo "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
          echo "APPLE_API_KEY=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"
      - name: Package
        shell: bash
        working-directory: desktop
        env:
          # macOS: Developer ID Application の証明書 (.p12 を base64) と公証
          CSC_LINK: ${{ runner.os == 'macOS' && secrets.MAC_CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ runner.os == 'macOS' && secrets.MAC_CSC_KEY_PASSWORD || '' }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          # Windows: コード署名の証明書 (.pfx を base64) と発行者名 (自動更新での署名検証に使う)
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          WIN_PUBLISHER_NAME: ${{ vars.WIN_PUBLISHER_NAME }}
          # 証明書が無いときに、キーチェーンの証明書を探しに行かない
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ secrets.MAC_CSC_LINK != '' && 'true' || 'false' }}
        # 配布物を作るだけ (GitHub Releases への添付は release のジョブがまとめて行う)
        run: npx electron-builder --config electron-builder.config.cjs --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: |
            release/desktop/*/*.dmg
            release/desktop/*/*.zip
            release/desktop/*/*.exe
            release/desktop/*/*.blockmap
            release/desktop/*/latest*.yml
          if-no-files-found: error

  release:
    # タグ desktop-v* のときだけ: 下書きのリリースを1つ作り、すべての配布物を添付する
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: artifacts
          merge-multiple: true
      - name: Collect the files
        shell: bash
        run: |
          mkdir dist-release
          find artifacts -type f \( -name '*.dmg' -o -name '*.zip' -o -name '*.exe' -o -name '*.blockmap' -o -name 'latest*.yml' \) \
            -exec cp {} dist-release/ \;
          # 自動更新の情報の配布物の名前を、このリリースのダウンロード用の絶対 URL にする
          node desktop/scripts/update-feed.mjs "$GITHUB_REF_NAME" dist-release/latest*.yml --repo "$GITHUB_REPOSITORY"
          ls -l dist-release
      - name: Create the draft release (or add to the existing draft)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="$GITHUB_REF_NAME"
          version="${tag#desktop-v}"
          if state=$(gh release view "$tag" --json isDraft --jq .isDraft 2>/dev/null); then
            # 公開済みのリリースは書き換えない
            [ "$state" = "true" ] || { echo "release $tag is already published"; exit 1; }
            gh release upload "$tag" dist-release/* --clobber
          else
            gh release create "$tag" dist-release/* --draft --verify-tag \
              --title "Docx Revision Analyzer $version (desktop preview)" \
              --notes "Desktop app $version. Write the release notes, check the files, then publish (do not set it as the latest release)."
          fi
